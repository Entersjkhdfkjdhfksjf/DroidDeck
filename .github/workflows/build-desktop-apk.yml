name: Build desktop APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Gradle build variant
        type: choice
        options: [release, debug]
        default: release
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: build-desktop-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      DROIDDECK_BUILD_VARIANT: ${{ inputs.variant || 'release' }}
      DROIDDECK_SKIP_RUST: '1'
      XBOX_SKIP_TESTS: '1'
      DROIDDECK_GITHUB_REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd unzip curl libarchive-tools

      - name: Resolve the pinned Android NDK
        run: bash tools/ci/resolve-ndk.sh

      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/droiddeck-build
            ~/.cache/droiddeck-xbox-cross
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: desktop-apk-${{ runner.os }}-${{ hashFiles('tools/**/*.sh', 'tools/**/*.env', 'tools/**/*.txt', 'tools/local-cross.Dockerfile', '**/*.gradle', 'gradle/**') }}
          restore-keys: |
            desktop-apk-${{ runner.os }}-

      - name: Fetch PulseAudio 13.0 source (GitHub's tag archive keeps returning 504)
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/pulseaudio-13.0"
          mkdir -p "$dest"
          for url in \
            https://freedesktop.org/software/pulseaudio/releases/pulseaudio-13.0.tar.gz \
            https://freedesktop.org/software/pulseaudio/releases/pulseaudio-13.0.tar.xz \
            https://codeload.github.com/pulseaudio/pulseaudio/tar.gz/refs/tags/v13.0 \
            https://github.com/pulseaudio/pulseaudio/archive/refs/tags/v13.0.tar.gz; do
            echo "trying $url"
            if curl -fsSL --retry 4 --retry-delay 10 --connect-timeout 20 -o "$RUNNER_TEMP/pa13.tar" "$url" \
                && tar -xaf "$RUNNER_TEMP/pa13.tar" -C "$dest" --strip-components=1 \
                && test -f "$dest/src/pulse/version.h.in"; then
              echo "DROIDDECK_PA13_SOURCE_DIR=$dest" >> "$GITHUB_ENV"
              echo "got PulseAudio 13.0 from $url"
              exit 0
            fi
            rm -rf "$dest"; mkdir -p "$dest"
          done
          echo "could not fetch the PulseAudio 13.0 source" >&2
          exit 1

      - name: Pre-pull the x86 preload base image (retry on registry rate limits)
        run: |
          ecr=public.ecr.aws/docker/library/debian:bullseye
          for attempt in 1 2 3 4 5 6; do
            if docker pull "$ecr"; then exit 0; fi
            echo "pull failed (attempt $attempt), waiting"
            sleep $((attempt * 20))
          done
          echo "falling back to Docker Hub's debian:bullseye"
          docker pull debian:bullseye
          docker tag debian:bullseye "$ecr"

      - name: Build
        env:
          DROIDDECK_NDK_VERSION: ${{ env.NDK_VERSION }}
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export DROIDDECK_BUILD_CACHE="$HOME/.cache/droiddeck-build"
          # Downloads and finished steps are cached, so a retry resumes where the last attempt stopped.
          ok=0
          for attempt in 1 2 3; do
            if bash tools/build_local.sh 2>&1 | tee -a /tmp/build.log; then ok=1; break; fi
            echo "build attempt $attempt failed, retrying in 30s"
            sleep 30
          done
          [ "$ok" = 1 ]

      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/droiddeck-build
            ~/.cache/droiddeck-xbox-cross
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: desktop-apk-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "app/build/outputs/apk/${DROIDDECK_BUILD_VARIANT}/app-${DROIDDECK_BUILD_VARIANT}.apk" "dist/DroidDesktop-${DROIDDECK_BUILD_VARIANT}.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: DroidDesktop-${{ env.DROIDDECK_BUILD_VARIANT }}-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7
